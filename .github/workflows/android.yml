name: Build ALAM FB Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - "alam_fb_manager_github_upload.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p project
          unzip -oq alam_fb_manager_github_upload.zip -d project
          echo "Project files:"
          find project -maxdepth 3 -type f | head -50

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          if [ -z "$SDK" ]; then
            SDK="$HOME/android-sdk"
          fi

          mkdir -p "$SDK/cmdline-tools"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          MANAGER=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager \
            -print -quit 2>/dev/null || true)

          if [ -z "$MANAGER" ]; then
            echo "Installing Android Command Line Tools"

            curl -fL --retry 3 \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -o /tmp/cmdline-tools.zip

            mkdir -p /tmp/android-tools
            unzip -oq /tmp/cmdline-tools.zip \
              -d /tmp/android-tools

            mkdir -p "$SDK/cmdline-tools/latest"

            cp -a /tmp/android-tools/cmdline-tools/. \
              "$SDK/cmdline-tools/latest/"

            MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi

          chmod +x "$MANAGER"
          "$MANAGER" --version

          set +e
          yes | "$MANAGER" --sdk_root="$SDK" --licenses
          set -e

          "$MANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project located at:"
          echo "$PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALAM-FB-Manager-v2-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
