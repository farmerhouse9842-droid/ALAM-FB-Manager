name: Build ALAM FB Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - "alam_fb_manager_github_upload.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -oq alam_fb_manager_github_upload.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Configure Kotlin
        run: |
          sed -i 's/plugins { id("com.android.application") }/plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") version "2.0.21" }/' app/build.gradle.kts

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ALAM-FB-Manager-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
