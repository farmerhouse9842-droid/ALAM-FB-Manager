name: Build ALAM FB Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - "alam_fb_manager_github_upload.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p project
          unzip -oq alam_fb_manager_github_upload.zip -d project
          find project -maxdepth 3 -type f | head -50

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/alam-android-sdk"
          mkdir -p "$SDK/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          curl -fL --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o /tmp/android-tools.zip

          unzip -oq /tmp/android-tools.zip -d /tmp/alam-tools

          cp -a /tmp/alam-tools/cmdline-tools/. \
            "$SDK/cmdline-tools/latest/"

          chmod +x "$SDK/cmdline-tools/latest/bin/sdkmanager"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" --version

          set +e
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" --licenses
          set -e

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Android Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project location: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Fix Java Kotlin JVM Target
        shell: bash
        run: |
          set -e
          FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "Gradle Kotlin file not found"
            exit 1
          fi

          cat >> "$FILE" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          EOF

          echo "Java and Kotlin JVM target set to 17"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALAM-FB-Manager-v2-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
